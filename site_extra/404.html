<!doctype html>
<html lang="en">
<head>

<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Page not found — alexo.io</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#eef0eb;--text:#33383d;--strong:#1a1d21;--muted:#51575d;--accent:#8e2338}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#151924;--text:#c8ccd2;--strong:#f0f1f2;--muted:#a0a6b1;--accent:#e06c7d}}
:root[data-theme=dark]{color-scheme:dark;--bg:#151924;--text:#c8ccd2;--strong:#f0f1f2;--muted:#a0a6b1;--accent:#e06c7d}
body{margin:0;min-height:100vh;display:grid;place-content:center;padding:1.5rem;background:var(--bg);color:var(--text);font:1.05rem/1.6 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.code{margin:0;font:0.8rem ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:var(--muted)}
h1{margin:.3rem 0 .6rem;font:600 2rem/1.2 'Iowan Old Style',Georgia,'Times New Roman',serif;color:var(--strong)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<p class="code">404</p>
<h1>Page not found</h1>
<p>There is nothing at this address. <a href="/">Back to alexo.io</a></p>
</main>
